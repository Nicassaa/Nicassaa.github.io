<!DOCTYPE html>
<html>
<head>
 
  <title>Attribute Selector</title>
  <style>
body { background:#EDE4FF; font-family:Arial; color:#3E1E68; padding:25px; }
h1 { color:#5D3FD3; text-align:center; }
<!-- attribute selector: style elements with a specific attribute -->
input[type="text"] { padding:8px; border:1px solid #CBB2FE; border-radius:6px; }
input[type="submit"] { background:#A066C9; color:white; padding:8px 12px; border:none; border-radius:6px; cursor:pointer; }
.box { max-width:700px; margin:12px auto; background:#FFF; padding:12px; border-radius:10px; }
  
.button {display: block;
background: #FF875F;
color: white;
text-decoration: none;
border-radius: 10px;
padding: 10px;
width: 200px;
margin: 10px auto;}
</style>
</head>
<body>
  <h1>Attribute Selector</h1>
  <div class="box">
    <p>Only text inputs use the text-input style, and submit buttons use a different style:</p>
    <input type="text" placeholder="Type here...">
    <input type="submit" value="Send">
  </div>
